name: build

on:
  push:
    branches:
    - '**'


jobs:
  test:
    runs-on:  windows-11-arm

    steps:
    - uses: actions/checkout@v6

    - name: Environment
      shell: bash
      run: |
        env | sort
        which go
        go env
        which gcc && gcc --version
        which clang && clang --version
        clang -dM -E -x c nul: || true
        go build a.go || true

    - name: Environement Powershell
      shell: pwsh
      run: |
        Write-Host $env:PATH
        go version
        go env

    - name: Prep
      shell: bash
      run: |
        ls /c/msys64
        echo 'c:\msys64\usr\bin' >> $GITHUB_PATH
        echo 'MSYSTEM=CLANGARM64' >> $GITHUB_ENV

    - name: Test
      shell: bash
      run: |
        mount
        env | sort
        pacman -Qe
        echo ---
        paman -Q

    - uses: msys2/setup-msys2@v2
      with:
        msystem: CLANGARM64
        install: >-
          mingw-w64-clang-aarch64-gcc-compat
          mingw-w64-clang-aarch64-go

    - name: Environment MSYS2
      shell: msys2 {0}
      run: |
        env | sort
        mount
        which go
        go env
        which gcc && gcc --version
        which clang && clang --version
        clang -dM -E -x c nul: || true
        go build a.go || true

