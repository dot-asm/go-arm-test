name: build

on:
  push:
    branches:
    - '**'


jobs:
  test:
    runs-on:  ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest, windows-11-arm ]
    steps:
    - uses: actions/checkout@v6

    - name: Environment
      shell: bash
      run: |
        env | sort
        which go
        go env
        which gcc && gcc --version
        which clang && clang --version
        clang -dM -E -x c nul: || true
        go build a.go || true

    - name: Environement Powershell
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        Write-Host $env:PATH
        go version
        go env

    - name: Prep MSYS2
      if: ${{ runner.os == 'Windows' }}
      shell: bash
      run: |
        ls /c/msys64
        echo 'c:\msys64\usr\bin' >> $GITHUB_PATH
        echo 'MSYSTEM=CLANGARM64' >> $GITHUB_ENV
        echo 'CHERE_INVOKING=1' >> $GITHUB_ENV
        /c/msys64/usr/bin/bash -lc 'pacman -S --noconfirm mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-go mingw-w64-clang-aarch64-pkgconf'

    - name: Install dependencies
      if: ${{ runner.os == 'Windows' }}
      shell: bash -leo pipefail {0}
      run: |
        mount
        env | sort
        pacman -Qe
        echo ---
        pacman -Q

    - name: Test
      shell: bash -leo pipefail {0}
      run: |
        pwd
        which go
        go env
        go build a.go
        sort | env

    - uses: msys2/setup-msys2@v2
      if: ${{ runner.os == 'Windows' }}
      with:
        msystem: CLANGARM64
        install: >-
          mingw-w64-clang-aarch64-gcc-compat
          mingw-w64-clang-aarch64-go

    - name: Environment MSYS2
      if: ${{ runner.os == 'Windows' }}
      shell: msys2 {0}
      run: |
        env | sort
        mount
        which go
        go env
        which gcc && gcc --version
        which clang && clang --version
        clang -dM -E -x c nul: || true
        go build a.go || true
